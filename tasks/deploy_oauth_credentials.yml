---
# Deploy OAuth credentials from local machine to remote Pis
# Usage: Copy credentials.db and access_tokens.db to roles/role-install-gcloud/files/
#        then run this task
#
# Files required in roles/role-install-gcloud/files/:
#   - credentials.db
#   - access_tokens.db  
#   - config_default
#   - active_config
#   - google_compute_engine (SSH private key)
#   - google_compute_engine.pub (SSH public key)

- name: "Deploy gcloud OAuth credentials"
  become: true
  become_user: "{{ local_ssh_user | default('njl') }}"
  block:
    - name: Ensure gcloud config directory exists
      ansible.builtin.file:
        path: "/home/{{ local_ssh_user | default('njl') }}/.config/gcloud/configurations"
        state: directory
        mode: "0700"
        recurse: yes

    - name: Copy credentials.db
      ansible.builtin.copy:
        src: "credentials.db"
        dest: "/home/{{ local_ssh_user | default('njl') }}/.config/gcloud/credentials.db"
        mode: "0600"

    - name: Copy access_tokens.db
      ansible.builtin.copy:
        src: "access_tokens.db"
        dest: "/home/{{ local_ssh_user | default('njl') }}/.config/gcloud/access_tokens.db"
        mode: "0600"

    - name: Copy active_config
      ansible.builtin.copy:
        src: "active_config"
        dest: "/home/{{ local_ssh_user | default('njl') }}/.config/gcloud/active_config"
        mode: "0644"

    - name: Copy config_default
      ansible.builtin.copy:
        src: "config_default"
        dest: "/home/{{ local_ssh_user | default('njl') }}/.config/gcloud/configurations/config_default"
        mode: "0644"

    - name: Verify gcloud authentication
      ansible.builtin.command:
        cmd: "gcloud auth list"
      register: gcloud_auth_check
      changed_when: false
      failed_when: false

    - name: Display authentication status
      ansible.builtin.debug:
        msg: "{{ gcloud_auth_check.stdout }}"

    - name: Copy google_compute_engine SSH private key
      ansible.builtin.copy:
        src: "google_compute_engine"
        dest: "/home/{{ local_ssh_user | default('njl') }}/.ssh/google_compute_engine"
        mode: "0600"

    - name: Copy google_compute_engine SSH public key
      ansible.builtin.copy:
        src: "google_compute_engine.pub"
        dest: "/home/{{ local_ssh_user | default('njl') }}/.ssh/google_compute_engine.pub"
        mode: "0644"
